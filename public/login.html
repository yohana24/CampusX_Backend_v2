<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusX - Sign in</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard-live.css">
    <link rel="stylesheet" href="auth-login.css">
</head>
<body class="login-body">

    <header class="login-top-bar">
        <div class="brand-badge-group">
            <div class="brand-logo">
                <i data-lucide="radio" class="logo-icon blue-text"></i>
                <span class="brand-name">CampusX</span>
            </div>
        </div>
    </header>

    <main class="login-main-wrapper">
        <section class="login-hero-section">
            <h1 class="hero-heading">CampusX Dashboard</h1>
            <p class="hero-description">Sign in to monitor rooms, devices and alerts.</p>
        </section>

        <section class="login-form-panel">
            <div class="form-header-title">
                <h2>Welcome Back</h2>
                <i data-lucide="shield" class="blue-text" style="width: 20px;"></i>
            </div>
            <p class="form-subtitle">Sign in with your CampusX account.</p>

            <form id="login-form" class="auth-form" autocomplete="on">
                <div class="form-group">
                    <label for="user-email">Username or email</label>
                    <div class="input-with-icon">
                        <i data-lucide="user" class="input-icon"></i>
                        <input type="text" id="user-email" name="username" autocomplete="username" required class="form-input" placeholder="Username or email">
                    </div>
                </div>

                <div class="form-group margin-top-12">
                    <label for="user-password">Password</label>
                    <div class="input-with-icon">
                        <i data-lucide="lock" class="input-icon"></i>
                        <input type="password" id="user-password" name="password" autocomplete="current-password" required class="form-input" placeholder="Enter your password">
                        <button type="button" class="pass-toggle-button" id="toggle-password" aria-label="Show password"><i data-lucide="eye"></i></button>
                    </div>
                </div>

                <p id="login-error" class="cx-login-error" role="alert" aria-live="polite" hidden></p>

                <p class="cx-signup-prompt">
                    Don't have an account?
                    <a href="/register.html" class="cx-signup-link">Create one</a>
                </p>

                <button type="submit" class="btn-authenticate" id="login-submit">
                    Sign in to CampusX &rarr;
                </button>
            </form>
        </section>
    </main>

    <script src="login.js"></script>
    <script>
        if (window.lucide) window.lucide.createIcons();
    </script>
</body>
</html>
